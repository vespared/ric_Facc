<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ric_Facc | Connessione Docente</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #08111f;
            --panel: rgba(15, 28, 51, 0.92);
            --line: rgba(136, 176, 255, 0.2);
            --text: #f5f8ff;
            --muted: #9cb3d9;
            --cyan: #2de2e6;
            --yellow: #ffd166;
            --green: #71f79f;
            --pink: #ff5fa2;
            --shadow: 0 20px 48px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Space Grotesk', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 10%, rgba(45, 226, 230, 0.16), transparent 35%),
                radial-gradient(circle at 90% 20%, rgba(255, 95, 162, 0.14), transparent 30%),
                radial-gradient(circle at 50% 90%, rgba(113, 247, 159, 0.12), transparent 35%),
                linear-gradient(165deg, #060c16 0%, #0c1830 55%, #08111f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            user-select: none;
        }

        .qr-card {
            width: 100%;
            max-width: 410px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 22px 22px 20px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(45, 226, 230, 0.12);
            border: 1px solid rgba(45, 226, 230, 0.35);
            color: var(--cyan);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 10px var(--green);
            animation: pulseDot 2s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        .connection-status {
            font-size: 0.78rem;
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .connection-status.is-connected {
            color: var(--green);
            font-weight: 700;
        }

        .title-block h1 {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.25;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .title-block p {
            font-size: 0.86rem;
            color: var(--muted);
            line-height: 1.35;
        }

        .qr-stage {
            background: #ffffff;
            padding: 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.9);
            width: 236px;
            height: 236px;
            position: relative;
        }

        .qr-stage svg,
        .qr-stage img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .qr-stage .qr-placeholder {
            color: #333;
            font-size: 0.85rem;
        }

        .url-box {
            background: rgba(8, 17, 31, 0.75);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .url-text {
            font-size: 0.86rem;
            font-family: Consolas, monospace;
            color: var(--yellow);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            user-select: all;
            text-align: left;
            flex: 1;
        }

        .btn-copy {
            background: rgba(45, 226, 230, 0.15);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-copy:hover {
            background: var(--cyan);
            color: #060c16;
            transform: translateY(-1px);
        }

        .btn-copy.copied {
            background: var(--green);
            border-color: var(--green);
            color: #060c16;
        }

        .interface-selector-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }

        .interface-selector-box label {
            font-size: 0.74rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .interface-selector {
            width: 100%;
            background: rgba(8, 17, 31, 0.85);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.82rem;
            outline: none;
            cursor: pointer;
        }

        .interface-selector:focus {
            border-color: var(--cyan);
        }

        .actions-row {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-action--primary {
            background: linear-gradient(135deg, #2de2e6, #00b4d8);
            color: #060c16;
        }

        .btn-action--primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn-action--secondary {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text);
            border: 1px solid var(--line);
        }

        .btn-action--secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .hint-block {
            background: rgba(255, 209, 102, 0.08);
            border: 1px dashed rgba(255, 209, 102, 0.3);
            border-radius: 12px;
            padding: 9px 12px;
            font-size: 0.74rem;
            color: #ffd88a;
            line-height: 1.35;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="qr-card">
        <header class="header-bar">
            <span class="brand-badge">
                <span class="status-dot"></span>
                Ric_Facc Rete
            </span>
            <span class="connection-status" id="liveStatusLabel">
                In attesa docente...
            </span>
        </header>

        <section class="title-block">
            <h1>Collega il Docente</h1>
            <p>Scansiona il QR code con smartphone o tablet per aprire il pannello di controllo.</p>
        </section>

        <section class="qr-stage" id="qrContainer">
            <div class="qr-placeholder">Caricamento QR Code...</div>
        </section>

        <section class="url-box">
            <div class="url-text" id="urlDisplay">http://...</div>
            <button type="button" class="btn-copy" id="btnCopy">Copia</button>
        </section>

        <section class="interface-selector-box" id="selectorBox" style="display: none;">
            <label for="ifaceSelect">Scheda di rete / Wi-Fi:</label>
            <select id="ifaceSelect" class="interface-selector"></select>
        </section>

        <div class="actions-row">
            <button type="button" class="btn-action btn-action--secondary" id="btnOpenLocal">
                🖥️ Apri su PC
            </button>
            <button type="button" class="btn-action btn-action--primary" id="btnStudentLocal">
                🎓 Pagina Studente
            </button>
        </div>

        <aside class="hint-block">
            💡 <strong>Promemoria:</strong> PC e tablet devono essere collegati alla <strong>stessa rete Wi-Fi</strong>.
        </aside>
    </div>

    <script src="qrcode.min.js"></script>
    <script>
        (function () {
            const qrContainer = document.getElementById('qrContainer');
            const urlDisplay = document.getElementById('urlDisplay');
            const btnCopy = document.getElementById('btnCopy');
            const selectorBox = document.getElementById('selectorBox');
            const ifaceSelect = document.getElementById('ifaceSelect');
            const liveStatusLabel = document.getElementById('liveStatusLabel');
            const btnOpenLocal = document.getElementById('btnOpenLocal');
            const btnStudentLocal = document.getElementById('btnStudentLocal');

            let currentTeacherUrl = '';
            let currentStudentUrl = '';
            let allInterfaces = [];

            function renderQr(targetUrl) {
                currentTeacherUrl = targetUrl;
                urlDisplay.textContent = targetUrl;
                urlDisplay.title = targetUrl;

                try {
                    if (typeof qrcode === 'function') {
                        const qr = qrcode(0, 'M');
                        qr.addData(targetUrl);
                        qr.make();
                        qrContainer.innerHTML = qr.createSvgTag({
                            cellSize: 5,
                            margin: 0,
                            scalable: true
                        });
                        return;
                    }
                } catch (err) {
                    console.warn('Errore rendering SVG QR code:', err);
                }

                // Fallback rendering
                qrContainer.innerHTML = '<div class="qr-placeholder"><a href="' + targetUrl + '" target="_blank" style="color:#000;">' + targetUrl + '</a></div>';
            }

            let teacherConnectedTriggered = false;

            function handleTeacherConnected() {
                if (teacherConnectedTriggered) return;
                teacherConnectedTriggered = true;

                const titleH1 = document.querySelector('.title-block h1');
                const titleP = document.querySelector('.title-block p');
                if (titleH1) titleH1.textContent = 'Docente Collegato!';
                if (titleP) titleP.textContent = 'QR Code acquisito. Apertura automatica del quiz studente nel browser...';

                qrContainer.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:12px; color:#08111f; text-align:center; padding:10px;">
                        <div style="font-size:3.5rem; line-height:1; animation: pulseDot 1s infinite alternate;">🎓</div>
                        <strong style="font-size:1.05rem; color:#0c1830;">Avvio Quiz Studente</strong>
                        <span style="font-size:0.8rem; color:#475569;">Apertura automatica nel browser in corso...</span>
                    </div>
                `;

                fetch('/api/open-student', { method: 'POST' }).catch(() => {});

                setTimeout(() => {
                    try {
                        window.close();
                    } catch (e) {}
                }, 1600);
            }

            async function fetchNetworkInfo() {
                try {
                    const res = await fetch('/api/network-info', { cache: 'no-store' });
                    if (!res.ok) throw new Error('Status ' + res.status);
                    const data = await res.json();

                    if (data.teacherConnected) {
                        liveStatusLabel.textContent = '✅ Docente connesso!';
                        liveStatusLabel.classList.add('is-connected');
                        handleTeacherConnected();
                    } else {
                        liveStatusLabel.textContent = '⏳ In attesa docente...';
                        liveStatusLabel.classList.remove('is-connected');
                    }

                    currentStudentUrl = data.studentUrl || (window.location.origin + '/');

                    const combined = [];
                    if (Array.isArray(data.lan)) {
                        data.lan.forEach(item => combined.push(item));
                    }
                    if (Array.isArray(data.others)) {
                        data.others.forEach(item => combined.push(item));
                    }

                    if (combined.length > 0) {
                        const hasChanged = combined.length !== allInterfaces.length ||
                            combined.some((item, i) => item.address !== (allInterfaces[i] && allInterfaces[i].address));

                        if (hasChanged) {
                            allInterfaces = combined;
                            populateSelector(combined, data.teacherUrl);
                        }
                    } else if (!currentTeacherUrl) {
                        renderQr(window.location.origin + '/teacher');
                    }
                } catch (err) {
                    if (!currentTeacherUrl) {
                        renderQr(window.location.origin + '/teacher');
                    }
                }
            }

            function populateSelector(interfaces, defaultUrl) {
                if (interfaces.length <= 1) {
                    selectorBox.style.display = 'none';
                    renderQr(interfaces[0] ? interfaces[0].teacherUrl : defaultUrl);
                    return;
                }

                selectorBox.style.display = 'flex';
                ifaceSelect.innerHTML = '';

                interfaces.forEach((iface, index) => {
                    const opt = document.createElement('option');
                    opt.value = iface.teacherUrl;
                    const tag = iface.isWifi ? ' [Wi-Fi]' : '';
                    opt.textContent = `${iface.name}: ${iface.address}${tag}`;
                    if (iface.teacherUrl === defaultUrl || (index === 0 && !defaultUrl)) {
                        opt.selected = true;
                    }
                    ifaceSelect.appendChild(opt);
                });

                renderQr(ifaceSelect.value || defaultUrl);
            }

            ifaceSelect.addEventListener('change', () => {
                renderQr(ifaceSelect.value);
            });

            btnCopy.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(currentTeacherUrl);
                    btnCopy.textContent = '✓ Copiato!';
                    btnCopy.classList.add('copied');
                    setTimeout(() => {
                        btnCopy.textContent = 'Copia';
                        btnCopy.classList.remove('copied');
                    }, 2000);
                } catch (e) {
                    const temp = document.createElement('input');
                    temp.value = currentTeacherUrl;
                    document.body.appendChild(temp);
                    temp.select();
                    document.execCommand('copy');
                    document.body.removeChild(temp);
                    btnCopy.textContent = '✓ Copiato!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copia';
                    }, 2000);
                }
            });

            btnOpenLocal.addEventListener('click', () => {
                window.open('/teacher', '_blank');
            });

            btnStudentLocal.addEventListener('click', () => {
                fetch('/api/open-student', { method: 'POST' }).catch(() => {});
                window.open('/', '_blank');
            });

            fetchNetworkInfo();
            setInterval(fetchNetworkInfo, 1000);
        })();
    </script>
</body>

</html>
